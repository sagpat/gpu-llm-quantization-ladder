apiVersion: v1
kind: Pod
metadata:
  name: mistral-int8
spec:
  restartPolicy: Never
  tolerations:
  - key: sku
    operator: Equal
    value: gpu
    effect: NoSchedule
  containers:
  - name: mistral
    image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
    resources:
      limits:
        nvidia.com/gpu: 1
    env:
    - name: HF_TOKEN
      value: "<HF-TOKEN>"
    command: ["/bin/bash", "-c", "pip install -q 'transformers==4.40.0' 'accelerate==0.29.0' bitsandbytes && python3 /phase2.py"]
    volumeMounts:
    - name: script
      mountPath: /phase2.py
      subPath: phase2.py
  volumes:
  - name: script
    configMap:
      name: phase2-script